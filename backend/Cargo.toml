[package]
name = "modeltrace-health"
version = "1.4.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "743a3aba70a4f78f27fb53d80a6e719599d2fe5e", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "rt", "sync", "time", "process"] }
uuid = { version = "1.23.4", features = ["v4"] }
url = "2.5.8"
base64 = "0.22.1"
flate2 = "1.1.9"
tar = "0.4.46"
tempfile = "3.27.0"
sha2 = "0.10.9"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
