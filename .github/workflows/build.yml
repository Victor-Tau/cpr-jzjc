name: Build plugin

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: python:3.11.17-bookworm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      CPR_TARGET: ${{ matrix.target }}
      CPR_NATIVE_BUILD: '1'
      CARGO_BUILD_JOBS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: build-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'backend/Cargo.lock', 'frontend/pnpm-lock.yaml', 'requirements-dev.txt', 'scripts/runtime_target.py', 'scripts/numpy-wheel*.sha256') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/go/pkg/mod
            ~/.cache/go-build
            backend/target
            .cache/pnpm
            .cache/runtime/${{ matrix.target }}
      - name: Install toolchains
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          npm install --global pnpm@9.12.2
          pnpm config set store-dir .cache/pnpm
          python3 -m pip install -r requirements-dev.txt
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          go env GOPATH | sed 's|$|/bin|' >> "$GITHUB_PATH"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = json.loads(Path('plugin.json').read_text())['version']
          assert json.loads(Path('frontend/package.json').read_text())['version'] == version
          assert tomllib.loads(Path('backend/Cargo.toml').read_text())['package']['version'] == version
          tag = os.environ['RELEASE_TAG']
          assert not tag or tag == 'v' + version, 'Tag and plugin version differ'
          PY
      - name: Build and verify package
        run: |
          rustup show
          python3 scripts/install_packager.py
          export PATH="$PWD/.cache/tools/bin:$PATH"
          bash scripts/package.sh
      - name: Run packaged RPC regressions
        run: |
          python3 - <<'PY'
          import subprocess, sys, tarfile, tempfile
          from pathlib import Path
          packages = list(Path('dist').glob('*.tar.gz'))
          assert len(packages) == 1
          with tempfile.TemporaryDirectory() as directory:
              with tarfile.open(packages[0]) as archive:
                  archive.extractall(directory, filter='data')
              subprocess.run([sys.executable, 'scripts/protocol_smoke.py', '--binary',
                              str(Path(directory) / 'bin/modeltrace-health'), '-v'], check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    name: Publish both architectures
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist/release
      - name: Check complete release
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('plugin.json').read_text())
          directory = Path('dist/release')
          expected = set()
          for target in ('x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu'):
              name = f"{manifest['publisher']}.{manifest['name']}-{manifest['version']}-{target}.tar.gz"
              package = directory / name
              checksum = package.with_name(name + '.sha256')
              assert checksum.read_text().split()[0] == hashlib.sha256(package.read_bytes()).hexdigest()
              expected.update((package, checksum))
          assert set(directory.iterdir()) == expected, 'Release must contain both targets'
          PY
      - name: Publish release assets
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.tar.gz dist/release/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
